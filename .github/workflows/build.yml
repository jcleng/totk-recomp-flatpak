name: Build Flatpak

# 创建 Release 需要写权限（默认 GITHUB_TOKEN 为只读）
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'io.github.jcleng.TotKRecomp.yaml'
      - 'totk-recomp-wrapper'
      - 'trim-noto-cjk-ttc.py'
      - '60-totk-cjk.conf'
      - 'io.github.jcleng.TotKRecomp.desktop'
      - 'io.github.jcleng.TotKRecomp.metainfo.xml'
      - 'icons/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 Release'
        type: boolean
        required: false
        default: true

env:
  TOTK_VERSION: "0.3.13"
  APP_ID: io.github.jcleng.TotKRecomp
  UPSTREAM_REPO: valentderah/totk-pc-recomp

jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      # 与清单中的 runtime org.freedesktop.Platform 25.08 对应
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先用带重试的 curl 把上游 AppImage 拉下来，再让 flatpak-builder 直接吃本地文件，
      # 避免上游 release CDN 的 504 抖动打断整个构建。
      - name: Prefetch upstream AppImage
        run: |
          set -eu
          URL="https://github.com/${UPSTREAM_REPO}/releases/download/v${TOTK_VERSION}/TotK-Setup-x86_64-${TOTK_VERSION}-linux.AppImage"
          SHA=$(grep -A2 'TotK-Setup-x86_64-.*linux.AppImage' "${APP_ID}.yaml" | grep sha256 | head -1 | awk '{print $2}')
          test -n "$SHA"
          echo "expect sha256: $SHA"
          for i in $(seq 1 10); do
            echo "::group::attempt $i"
            if curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --max-time 1800 -o upstream.AppImage "$URL"; then
              if echo "$SHA  upstream.AppImage" | sha256sum -c -; then
                echo "::endgroup::"
                ls -lh upstream.AppImage
                exit 0
              fi
              echo "checksum mismatch, retrying"
            fi
            echo "::endgroup::"
            sleep 10
          done
          echo "::error::无法下载上游 AppImage（多次重试后仍失败）"
          exit 1

      - name: Patch manifest to local source
        run: |
          set -eu
          python3 - <<'PY'
          import os, re
          app = os.environ['APP_ID']
          manifest = f'{app}.yaml'
          text = open(manifest).read()
          # 把 remote file source 换成同目录下的本地文件（flatpak-builder 支持 type: file + path）
          pattern = re.compile(
              r'- type: file\n\s+url: https://github\.com/[^\n]*/releases/download/'
              r'[^\n]+\n\s+sha256: [0-9a-f]+\n\s+dest-filename: TotK-Setup\.appimage\n')
          new = '- type: file\n        path: upstream.AppImage\n        dest-filename: TotK-Setup.appimage\n'
          text2, n = pattern.subn(new, text)
          assert n == 1, f'expected 1 remote appimage source, patched {n}'
          open(manifest, 'w').write(text2)
          print('manifest patched -> local upstream.AppImage')
          PY
          grep -n -A3 'type: file' "${APP_ID}.yaml" | head -12

      # appstreamcli 要到构建末尾（已花十几分钟）才报 metainfo 错误，报过 "metainfo-parsing-error"。
      # 把风险点提前卡住：XML 注释里不能出现 "--"（XML 规范禁止，写 --env= 这类命令行就会中招）、
      # 文件必须能解析、组件只能有一个 launchable。
      - name: Lint metainfo before the long build
        run: |
          set -eu
          python3 - <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          p = "io.github.jcleng.TotKRecomp.metainfo.xml"
          src = open(p, encoding="utf-8").read()
          for i, line in enumerate(src.splitlines(), 1):
              for m in re.finditer(r"<!--(.*?)-->", line):
                  if "--" in m.group(1):
                      sys.exit(f"{p}:{i}: XML 注释不能包含 '--'：{m.group(1)!r}")
          root = ET.parse(p).getroot()
          ls = root.findall("launchable")
          if len(ls) != 1:
              sys.exit(f"{p}: 期望 1 个 launchable，实际 {len(ls)} 个")
          print("metainfo ok: well-formed, 1 launchable, no '--' in comments")
          PY

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.APP_ID }}.flatpak
          manifest-path: ${{ env.APP_ID }}.yaml
          cache-key: flatpak-builder-totk-${{ env.TOTK_VERSION }}
          repository-name: flathub
          branch: stable
          upload-artifact: false

      - name: Verify bundle
        run: |
          set -eu
          ls -lh "${APP_ID}.flatpak"
          echo "bundle size: $(stat -c %s "${APP_ID}.flatpak") bytes"
          flatpak install --user --noninteractive --bundle "${APP_ID}.flatpak" || {
            echo "::error::bundle 安装校验失败"
            exit 1
          }
          flatpak list --app --columns=application,branch

      # 安装器首次启动时 layout.py 会逐个 stat 自带工具链，缺一个就直接报 "release incomplete"。
      # 这一段在沙箱里把同一份检查跑一遍，再真的用自带 clang 编译并运行 hostcheck（Vulkan 探测），
      # 把「包能装但一运行就报错」挡在发布之前。
      - name: Verify bundled toolchain inside the sandbox
        run: |
          set -eu
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            R=/app/share/totk-recomp
            echo "::group::release tree"
            du -sh "$R"
            ls "$R"
            echo "::endgroup::"

            echo "::group::build-time self check (same list as the manifest)"
            for p in \
              python/bin/python3 \
              llvm/bin/clang llvm/bin/lld llvm/sysroot \
              bin/totk_xlate bin/ninja bin/hactool bin/libSDL3.so.0 \
              data/shader_list.tsv \
              runtime/libtotkrt.a runtime/libtotkrt-v2.a \
              runtime/deps/include/vulkan/vulkan.h \
              runtime/deps/include/vma/vk_mem_alloc.h \
              runtime/deps/lib/libzstd.a \
              tools/build_game.py tools/prepare_shaders.py tools/make_romfs_patches.py \
              recomp/gen.py recomp/patches-v143.txt \
              tools/data/expected-v1.4.3.json \
              installer/gui.py installer/cli.py ; do
              test -e "$R/$p" || { echo "MISSING: $R/$p"; exit 1; }
            done
            echo "all bundled paths present"
            echo "::endgroup::"

            echo "::group::bundled python modules"
            "$R/python/bin/python3" -c "import numpy, lz4, cryptography, fontTools, cffi, tkinter; print(\"python modules ok\")"
            # installer/ 必须已在构建期预编译：否则运行时才会首次编译，而上游 recent.py 的无效转义
            # 会在那时刷出 SyntaxWarning（PYTHONWARNINGS 压不住编译期警告）
            n=$(find "$R/installer" -name '*.pyc' | wc -l)
            echo "installer bytecode files: $n"
            test "$n" -gt 0 || { echo "::error::installer/ was not precompiled at build time"; exit 1; }
            echo "::endgroup::"

            echo "::group::the installer finds its own layout"
            # layout.find() 是安装器一切路径的来源；release 模式下它必须认出这是 release 而不是源码树
            cd "$R"
            PYTHONDONTWRITEBYTECODE=1 "$R/python/bin/python3" -c "
            from installer import layout
            lay = layout.find()
            assert not lay.dev, \"layout detected as dev mode\"
            print(\"release:\", lay.release)
            missing = lay.missing()
            assert not missing, f\"missing: {missing}\"
            print(\"layout.layout.missing() is empty -> the setup will pass its own check step\")
            "
            echo "::endgroup::"

            echo "::group::bundled clang compiles and links against the bundled sysroot"
            cd /tmp
            cp "$R/installer/hostcheck.c" .
            "$R/llvm/bin/clang" -O1 hostcheck.c -o hostcheck \
              -I "$R/runtime/deps/include" --sysroot="$R/llvm/sysroot" -fuse-ld=lld -ldl
            ./hostcheck
            echo "::endgroup::"
          '

      # 安装器是 Tk 窗口程序。用 Xvfb 起一个虚拟显示，确认 GUI 真的能建出窗口并跑到
      # 主循环（--selftest 会建窗口、走一遍状态机、然后自己退出），
      # 这样能覆盖 Tcl/Tk 数据目录、libXft、fontconfig 与打包路径。
      - name: Verify the setup GUI starts inside the sandbox
        run: |
          set -eu
          # 容器内装 Xvfb（构建镜像基于 Fedora，优先 dnf）
          if ! command -v Xvfb >/dev/null; then
            dnf install -y xorg-x11-server-Xvfb || \
              (microdnf install -y xorg-x11-server-Xvfb) || \
              { echo "::warning::无法安装 Xvfb，跳过 GUI 冒烟测试"; exit 0; }
          fi
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 3
          set +e
          # 直接跑真实的包装脚本（而不是绕开它调 python），这样验的就是用户走的那条路径，
          # 连带覆盖 wrapper 里的 Tcl/Tk 路径、PYTHONWARNINGS 过滤与 exec。
          DISPLAY=:99 timeout 180 flatpak run "${APP_ID}" --selftest >/tmp/selftest.log 2>&1
          RC=$?
          set -e
          kill "$XVFB_PID" 2>/dev/null || true
          tail -40 /tmp/selftest.log
          echo "selftest exit code: $RC"
          # 0 = 全部页面建出来了；非 0 说明 Tk 在沙箱里起不来或页面断言失败
          test "$RC" -eq 0 || { echo "::error::安装器 GUI 在沙箱内无法启动（退出码 $RC）"; exit 1; }
          # 上游 recent.py 的 docstring 无效转义 warning 不应刷到用户终端
          if grep -q 'SyntaxWarning' /tmp/selftest.log; then
            echo "::error::输出里仍然有 SyntaxWarning（上游 recent.py 的无效转义未被过滤）"
            exit 1
          fi

      # 中文界面的字形覆盖：这就是「设置界面中文显示问号」那个 bug 的回归测试。
      #
      # 根因（对照上游源码核实）：installer/gui.py 在非 Windows 上把界面字体写死成 `DejaVu Sans`
      # （日志框 `DejaVu Sans Mono`），Tk 9 在 Linux 上走 Xft/fontconfig 渲染。DejaVu 不含任何汉字，
      # 汉字只能来自 fontconfig 的兜底链；而 Flatpak 沙箱里原本没有任何 CJK 字体，
      # 兜底链拿不出字形，于是界面上所有中文都画成了问号/豆腐块。
      #
      # 注意两个容易踩的坑，这个步骤专门绕开它们：
      #   1. 不能用 font.measure() 判断——实测在完全没有 CJK 字体时它依然返回非 0 宽度
      #      （Xft 给缺字返回回退字形的宽度），断不出问题。
      #   2. 不能只看「字体文件存在」——字体装错目录时 fontconfig 根本不收录。
      #
      # 真正可靠的判据是 Fontconfig 的字符集查询：`fc-list :charset=<码位>` 只列出**真的能画出
      # 这个字**的字体。实测只有 DejaVu 时它返回 0 条，装上 Noto CJK 后返回 5 条，
      # 与 Tk 实际渲染出来的像素结果一致（无字体时每个汉字都渲染成与私用区字符 uE000 完全相同的
      # 豆腐块）。所以这里：① 逐个码位断言有字体能画；② 断言缺字时落到简体 SC 而不是日文 JP。
      - name: Verify CJK glyphs reach the Tk window
        run: |
          set -eu

          echo '::group::font and fontconfig rule are installed'
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            FONT=/app/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
            CONF=/app/share/fontconfig/conf.avail/60-totk-cjk.conf
            test -r "$FONT" || { echo "MISSING: $FONT"; exit 1; }
            test -r "$CONF" || { echo "MISSING: $CONF"; exit 1; }
            ls -l "$FONT" "$CONF"
            # 5 个字面（JP/KR/SC/TC/HK Regular），不是被裁空的壳
            python3 - "$FONT" <<PY
          import struct, sys
          d = open(sys.argv[1], "rb").read()
          assert d[:4] == b"ttcf", d[:4]
          n = struct.unpack_from(">I", d, 8)[0]
          assert n == 5, f"expected 5 faces, got {n}"
          print(f"collection of {n} faces, {len(d)} bytes")
          PY
          '
          echo '::endgroup::'

          echo '::group::every Chinese character of the window has a font'
          # 取 installer/text/zh-Hans.json 的真实界面字符串，而不是随手挑几个字：
          # 只要有一个字符没有任何字体能画，用户就在那一行看到问号。
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            python3 - <<PY
          import json, subprocess, sys
          cat = json.load(open("/app/share/totk-recomp/installer/text/zh-Hans.json", encoding="utf-8"))
          chars = set()
          for k, v in cat.items():
              if k.startswith(("ui.", "step.", "phase.", "check.", "fonts.", "warn.")):
                  chars.update(v)
          # 只看 CJK 区（汉字、假名、韩文、全角标点）；拉丁字母与符号本来就由 DejaVu 覆盖。
          chars = sorted(c for c in chars if ord(c) > 0x2E7F)
          print(f"{len(chars)} CJK characters in the window text")
          bad = []
          for c in chars:
              # fc-list :charset 只列出真的能画出该码位的字体；空输出 = 这个字会渲染成问号。
              out = subprocess.run(["fc-list", f":charset={ord(c):08x}"], capture_output=True, text=True).stdout
              if not out.strip():
                  bad.append(c)
          if bad:
              sys.exit("no font can draw: " + repr("".join(bad)))
          print(f"ok: all {len(chars)} CJK characters of the window have a font")
          PY
          '
          echo '::endgroup::'

          echo '::group::DejaVu falls back to the Simplified-Chinese face'
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            # 复刻包装脚本写出的主配置：include runtime 原配置 + 我们的 60-totk-cjk.conf
            SYS_FC=/etc/fonts/fonts.conf
            test -r "$SYS_FC" || SYS_FC=/usr/share/fontconfig/fonts.conf
            test -r "$SYS_FC" || { echo "no system fontconfig in the runtime"; exit 1; }
            FC=/tmp/fc-ci.conf
            {
              printf "%s\n" "<?xml version=\"1.0\"?>"
              printf "%s\n" "<!DOCTYPE fontconfig SYSTEM \"fonts.dtd\">"
              printf "%s\n" "<fontconfig>"
              printf "  <include ignore_missing=\"yes\">%s</include>\n" "$SYS_FC"
              printf "%s\n" "  <include ignore_missing=\"yes\">/app/share/fontconfig/conf.avail/60-totk-cjk.conf</include>"
              printf "%s\n" "</fontconfig>"
            } > "$FC"
            # fc-match 总是返回某个字体，所以这里断言的是「具体返回哪一个」：缺汉字时必须是 SC。
            for fam in "DejaVu Sans" "DejaVu Sans Mono"; do
              m=$(FONTCONFIG_FILE=$FC fc-match "$fam:charset=00008bbe")
              echo "$fam + U+8BBE -> $m"
              case "$m" in
                *"Noto Sans CJK SC"*) ;;
                *) echo "ERROR: $fam does not fall back to the SC face (got: $m)"; exit 1 ;;
              esac
            done
          '
          echo '::endgroup::'

          echo '::group::the wrapper enables the CJK rule'
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            # 包装脚本必须引用字体与规则文件（它们是唯一让 fontconfig 优先 SC 的地方）
            grep -q "NotoSansCJK-Regular.ttc" /app/bin/totk-recomp-wrapper
            grep -q "60-totk-cjk.conf" /app/bin/totk-recomp-wrapper
            grep -q "FONTCONFIG_FILE" /app/bin/totk-recomp-wrapper
            echo "the wrapper points fontconfig at the CJK rule"
          '
          echo '::endgroup::'

      # 游戏内菜单（Dear ImGui）的 CJK 字体：上游 plat_font_path() 只 stat 五个写死的
      # /usr/share/fonts/... 路径（runtime/platform/linux.c:1254），沙箱里全部落空，
      # 于是 menu.cpp 的 fonts_up() 一个字体都没合并，汉字全画成 '?'。
      #
      # 这条不能用「字体文件存在」或「fc-list 能查到」断言——两者在 bug 存在时也都成立
      # （用户机器上就有 105 条宿主 CJK 字体而菜单依然全是问号）。唯一可信的判据是
      # 把上游那两个函数（plat_file_exists + plat_file_read）逐字复刻出来，直接问它能不能
      # 拿到字体，并且要求带 shim 时的答案从 0 变成 4。
      - name: Verify the in-game menu can reach a CJK font
        run: |
          set -eu

          echo '::group::shim is installed and carries the five upstream paths'
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            test -r /app/lib/totk-cjk-path.so || { echo "MISSING: /app/lib/totk-cjk-path.so"; exit 1; }
            test -r /app/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc || { echo "MISSING font"; exit 1; }
            for s in \
              /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc \
              /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc \
              /usr/share/fonts/google-noto-cjk/NotoSansCJK-Regular.ttc \
              /usr/share/fonts/noto/NotoSansCJK-Regular.ttc \
              /usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc ; do
              grep -qa -- "$s" /app/lib/totk-cjk-path.so || { echo "shim lacks $s"; exit 1; }
            done
            grep -q "LD_PRELOAD" /app/bin/totk-play || { echo "totk-play does not inject the shim"; exit 1; }
            grep -q "totk-cjk-path.so" /app/bin/totk-play || { echo "totk-play does not name the shim"; exit 1; }
            echo "ok: shim present, totk-play injects it"
          '
          echo '::endgroup::'

          echo '::group::plat_font_path goes from 0 of 4 to 4 of 4'
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            R=/app/share/totk-recomp
            cd /tmp
            cat > mimic.c <<"CEOF"
          /* The two upstream functions that decide the menu font, copied verbatim from
             runtime/platform/linux.c (plat_file_exists + plat_file_read) and the loop of
             menu.cpp fonts_up(). Kept in sync by hand; the point is to ask the same
             question the game itself asks, not to test the shim in isolation. */
          #include <stdio.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <stdint.h>
          #include <stdlib.h>
          static int plat_file_exists(const char *path) {
              struct stat st;
              return !stat(path, &st) && !S_ISDIR(st.st_mode);
          }
          static int plat_font_path(const char *lang, char *out, size_t cap) {
              static const char *files[] = {
                  "/usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc",
                  "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
                  "/usr/share/fonts/google-noto-cjk/NotoSansCJK-Regular.ttc",
                  "/usr/share/fonts/noto/NotoSansCJK-Regular.ttc",
                  "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
              };
              if (strcmp(lang, "ja") && strcmp(lang, "ko") && strcmp(lang, "zh-Hans") && strcmp(lang, "zh-Hant")) return 0;
              for (size_t i = 0; i < sizeof files / sizeof *files; i++)
                  if (plat_file_exists(files[i])) return snprintf(out, cap, "%s", files[i]) < (int)cap;
              return 0;
          }
          static uint8_t *plat_file_read(const char *path, uint64_t *size) {
              int fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) return NULL;
              struct stat st; uint8_t *buf = NULL;
              if (!fstat(fd, &st) && S_ISREG(st.st_mode) && st.st_size > 0 && st.st_size < (1ll << 30)) {
                  buf = malloc((size_t)st.st_size + 1);
                  size_t got = 0;
                  while (buf && got < (size_t)st.st_size) {
                      ssize_t k = read(fd, buf + got, (size_t)st.st_size - got);
                      if (k <= 0) break;
                      got += (size_t)k;
                  }
                  if (buf && got != (size_t)st.st_size) { free(buf); buf = NULL; }
                  if (buf) { buf[st.st_size] = 0; *size = (uint64_t)st.st_size; }
              }
              close(fd);
              return buf;
          }
          int main(void) {
              const char *langs[] = {"ja", "ko", "zh-Hans", "zh-Hant"};
              int merged = 0;
              for (int i = 0; i < 4; i++) {
                  char path[512]; uint64_t size = 0;
                  if (!plat_font_path(langs[i], path, sizeof path) || !(plat_file_read(path, &size))) continue;
                  merged++;
              }
              printf("merged=%d\n", merged);
              return 0;
          }
          CEOF
            "$R/llvm/bin/clang" -O1 --sysroot="$R/llvm/sysroot" -fuse-ld=lld -o mimic mimic.c

            # 1. 不带 shim：必须重现 bug（0），否则说明这个测试没在测真东西
            bare=$(./mimic)
            echo "without shim: $bare"
            test "$bare" = "merged=0" || {
              echo "::error::expected merged=0 without the shim, got $bare"
              exit 1; }

            # 2. 带 shim：四个语言都必须拿到字体
            fixed=$(LD_PRELOAD=/app/lib/totk-cjk-path.so ./mimic)
            echo "with shim:    $fixed"
            test "$fixed" = "merged=4" || {
              echo "::error::the shim does not make the menu font reachable ($fixed)"
              exit 1; }
            echo "ok: 0 of 4 -> 4 of 4"
          '
          echo '::endgroup::'

          echo '::group::the shim leaves every other path alone'
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            # 只改那五个字符串：相似路径、真实文件、不存在的路径都必须保持原样。
            # 这是 shim 唯一的风险点（拦错路径会把游戏数据重定向走），所以单独验。
            R=/app/share/totk-recomp
            cd /tmp
            cat > others.c <<"CEOF"
          /* os.path.exists() equivalent, run with and without the shim. */
          #include <stdio.h>
          #include <string.h>
          #include <sys/stat.h>
          static int exists(const char *p) { struct stat st; return !stat(p, &st) && !S_ISDIR(st.st_mode); }
          int main(void) {
              static const struct { const char *p; int want; } k[] = {
                  {"/app/share/totk-recomp/installer/gui.py", 1},
                  {"/app/bin/totk-play", 1},
                  {"/usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc.bak", 0},
                  {"/usr/share/fonts/noto-cjk/NotoSansCJK-Regular-Bold.ttc", 0},
                  {"/nonexistent/nope", 0},
              };
              int bad = 0;
              for (size_t i = 0; i < sizeof k / sizeof *k; i++)
                  if (exists(k[i].p) != k[i].want) { printf("WRONG: %s\n", k[i].p); bad++; }
              printf("unexpected rewrites: %d\n", bad);
              return bad ? 1 : 0;
          }
          CEOF
            "$R/llvm/bin/clang" -O1 --sysroot="$R/llvm/sysroot" -fuse-ld=lld -o others others.c
            LD_PRELOAD=/app/lib/totk-cjk-path.so ./others
            echo "ok: only the five upstream paths are rewritten"
          '
          echo '::endgroup::'

      # 上一个步骤显式设了 DISPLAY=:99，所以它永远测不到「Wayland 会话下 X11 被拿掉」这个回归。
      # 注意：不能用 --unset-env=DISPLAY 模拟——那等于「宿主根本没有 X server」，
      # 不是 Wayland 场景，而且沙箱里 /tmp/.X11-unix 是私有的，永远看不到宿主的 Xvfb。
      #
      # 真正要防的是 flatpak 元数据里的 socket 配置错误。按 flatpak 文档：
      #   fallback-x11 让 X11 socket 只在没有 wayland socket 时可用，
      #   且两者同时存在时 fallback-x11 优先。
      # Tk 9 没有 Wayland 后端，所以只要 metadata 里出现 fallback-x11 或缺少 x11，
      # Wayland 桌面下安装器就必然起不来。这里直接断言元数据。
      - name: Verify the sandbox grants X11 for the Tk setup window
        run: |
          set -eu
          META=$(flatpak info --show-metadata "${APP_ID}")
          echo "$META"
          echo "---- checks ----"
          # 必须有 x11（Tk 只能走 X11/XWayland）
          echo "$META" | grep -q 'sockets=.*x11' || {
            echo "::error::metadata 缺少 x11 socket，Wayland 桌面下 Tk 将无法启动"
            exit 1
          }
          # 绝不能有 fallback-x11（它会在有 wayland socket 时禁掉 X11）
          if echo "$META" | grep -q 'fallback-x11'; then
            echo "::error::metadata 含 fallback-x11：Wayland 会话下 X11 会被禁用，Tk 9 无法启动"
            exit 1
          fi
          # 沙箱里真的能拿到宿主 X socket 与 DISPLAY
          DISPLAY=:99 flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            echo "DISPLAY=$DISPLAY"
            ls -d /tmp/.X11-unix
            test -n "$DISPLAY"
          '
          echo "X11 is available to the sandbox"

      - name: Verify wrapped entry point resolves
        run: |
          set -eu
          # 包装脚本本身在 Xvfb 下跑起来会打开窗口，这里只验证它的落点都对：
          # 目标 python 存在、Tcl/Tk 数据目录存在、最后的 exec 指向正确。
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            sed -n "/^exec /p" /app/bin/totk-recomp-wrapper
            test -x /app/share/totk-recomp/python/bin/python3
            test -d /app/share/totk-recomp/python/lib/tcl9.0
            test -d /app/share/totk-recomp/python/lib/tk9.0
            echo "wrapper targets exist"
          '

      # 中文/韩文界面需要 Switch 固件里的 BFTTF 字体，提取工具靠 release 自带的 cryptography。
      # runtime 的 /usr/bin/python3 没有这个模块（用户报过 ModuleNotFoundError），
      # 所以 totk-extract-fonts 必须用自带的 Python。这里在沙箱内把它真的跑起来。
      - name: Verify the font extractor runs with the bundled Python
        run: |
          set -eu
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            echo "::group::runtime python3 has no cryptography (expected)"
            if /usr/bin/python3 -c "import cryptography" 2>/dev/null; then
              echo "::warning::runtime python3 unexpectedly provides cryptography"
            else
              echo "confirmed: /usr/bin/python3 cannot import cryptography"
            fi
            echo "::endgroup::"

            echo "::group::bundled python provides cryptography"
            /app/share/totk-recomp/python/bin/python3 -c "import cryptography; print(\"cryptography\", cryptography.__version__)"
            echo "::endgroup::"

            echo "::group::totk-extract-fonts reaches the tool via the bundled Python"
            # 注意：pattern 以 -- 开头，必须用 `grep -q -- "--x"` 把选项与模式隔开，
            # 否则 grep 把 --firmware 当成自己的选项直接报 usage。
            OUT=$(/app/bin/totk-extract-fonts --help)
            echo "$OUT" | head -3
            echo "$OUT" | grep -q -- "--firmware"
            echo "$OUT" | grep -q -- "--xci"
            echo "::endgroup::"

            echo "::group::tool imports its sibling modules"
            # extract_exefs/extract_romfs 是脚本的本地依赖，路径放错就会 ImportError
            /app/share/totk-recomp/python/bin/python3 -c "
            import sys
            sys.path.insert(0, \"/app/share/totk-recomp/tools/vendor/macnativegames\")
            import extract_shared_fonts as m
            print(\"fonts wanted:\", len(m.FONTS))
            assert len(m.FONTS) == 6
            "
            echo "::endgroup::"
            echo "font extractor is usable inside the sandbox"
          '

      # 游戏入口 totk-play 的关键行为：必须把游戏目录放在 LD_LIBRARY_PATH 最前面。
      # 游戏的 RUNPATH 是 $ORIGIN，但 LD_LIBRARY_PATH 优先于 RUNPATH，而 runtime 带的是更新版的
      # libSDL3.so.0（0.2.30 vs release 的 4.4.18）。顺序写反了就会用错 SDL。这里直接断言顺序，
      # 并用一个假的游戏目录实际跑一遍（不需要真游戏）。
      - name: Verify totk-play puts the game folder first in LD_LIBRARY_PATH
        run: |
          set -eu
          # 1. 静态断言①：赋值行把 $GAME 放在自己的前面
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            grep -n "^LD_LIBRARY_PATH=" /app/bin/totk-play
            grep -q "^LD_LIBRARY_PATH=\"\${GAME}" /app/bin/totk-play || {
              echo "totk-play does not put the game folder first in LD_LIBRARY_PATH"; exit 1; }
            grep -q "^cd \"\${GAME}\"" /app/bin/totk-play || {
              echo "totk-play does not cd into the game folder"; exit 1; }
          '

          # 2. 行为断言：造一个假的游戏目录，抄一份真的 libSDL3.so.0 进去，
          #    看 totk-play 实际跑起来时 LD_LIBRARY_PATH 是不是游戏目录在前（用 totk 替身打印环境）。
          #    注意用 /tmp 而不是 $HOME：CI 里 $HOME=/github/home 不可写。
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            GAME=/tmp/totk-play-test
            rm -rf "$GAME"; mkdir -p "$GAME"
            # 替身 totk：把 LD_LIBRARY_PATH 第一段和当前目录打出来
            printf "#!/bin/sh\necho \"FIRST=\${LD_LIBRARY_PATH%%:*}\"\necho \"CWD=\$(pwd)\"\n" > "$GAME/totk"
            chmod +x "$GAME/totk"
            OUT=$(TOTK_GAME_DIR="$GAME" /app/bin/totk-play)
            echo "$OUT"
            echo "$OUT" | grep -qx "FIRST=$GAME" || { echo "::error::LD_LIBRARY_PATH does not start with the game folder"; exit 1; }
            echo "$OUT" | grep -qx "CWD=$GAME"     || { echo "::error::totk-play did not run from the game folder"; exit 1; }
            rm -rf "$GAME"
            echo "totk-play orders LD_LIBRARY_PATH and cwd correctly"
          '

          # 3. 缺目录 / 缺 totk 时报错而不是静默失败
          flatpak run --command=sh "${APP_ID}" -c '
            set -eu
            if TOTK_GAME_DIR=/nonexistent-totk-dir /app/bin/totk-play 2>/dev/null; then
              echo "::error::totk-play accepted a missing game folder"; exit 1
            fi
            echo "missing folder is rejected"
          '
          flatpak uninstall --user -y "${APP_ID}" || true

      - name: Compute checksum
        run: |
          set -eu
          sha256sum "${APP_ID}.flatpak" | tee sha256.txt
          SHA=$(sha256sum "${APP_ID}.flatpak" | awk '{print $1}')
          echo "SHA256_FULL=${SHA}  ${APP_ID}.flatpak" >> "$GITHUB_ENV"

      - name: Generate release notes
        run: |
          set -eu
          DATE=$(date +%Y%m%d)
          TAG=v${TOTK_VERSION}-${DATE}
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=TotK Recomp ${TOTK_VERSION} Setup Flatpak (${TAG})" >> "$GITHUB_ENV"
          {
            echo "# TotK Recomp Setup Flatpak"
            echo ""
            echo "> 非官方 Flatpak 封装，直接打包上游官方 Linux AppImage Release，不做源码编译。"
            echo ""
            echo "## 安装方法"
            echo ""
            echo '```bash'
            echo "# 下载 ${APP_ID}.flatpak 后："
            echo "flatpak install --user ${APP_ID}.flatpak"
            echo "flatpak run ${APP_ID}"
            echo '```'
            echo ""
            echo "## 重要提示"
            echo ""
            echo "**本包不含任何游戏文件或密钥。** 你需要自备合法获得的《王国之泪》本体与更新（XCI/NSP/NSZ）"
            echo "以及自己的 prod.keys。安装器会在你选择的目标目录里，用自带的 LLVM 工具链在本机把游戏编译出来"
            echo "（约 20-40 分钟，取决于 CPU 核心数与磁盘）。"
            echo ""
            echo "编译完成后得到的是普通可执行文件 \`totk\`。**用本包提供的游戏入口在沙箱内启动它**：先设置一次游戏目录，"
            echo "之后从应用菜单点 **TotK** 即可。"
            echo ""
            echo '```bash'
            echo "# 指向含有 totk 的目录（不是父目录）"
            echo "flatpak override --user --env=TOTK_GAME_DIR=/path/to/game ${APP_ID}"
            echo ""
            echo "# 或者单次运行"
            echo "flatpak run --command=totk-play ${APP_ID}"
            echo '```'
            echo ""
            echo "### 中文/韩文界面字体"
            echo ""
            echo "**安装器界面（设置窗口）的中文：本包已内置字体，无需任何操作。**"
            echo ""
            echo "以前设置界面的中文全是问号：上游安装器用的是 Tk 9，\`installer/gui.py\` 在 Linux 上把字体写死成"
            echo "\`DejaVu Sans\`，而 DejaVu 没有任何汉字，沙箱里又没有 CJK 字体可以让 fontconfig 回退，"
            echo "于是所有汉字都画成了问号。本版本把 Noto Sans CJK 装进 \`/app/share/fonts\`（fontconfig 会收录），"
            echo "并附一份规则让缺字时优先回退到简体字形（而不是日文字形），中文界面从此直接可用。"
            echo ""
            echo "**游戏内文本（简体/繁体中文、韩文）** 仍需 Switch 固件里的系统字体（BFTTF）。已编译完的话不用重装，"
            echo "直接提取到游戏目录的 \`shared-fonts/\`（目录必须尚不存在）："
            echo ""
            echo '```bash'
            echo "flatpak run --command=totk-extract-fonts ${APP_ID} \\"
            echo "  --keys /path/to/prod.keys \\"
            echo "  --firmware /path/to/firmware \\"
            echo "  --output /path/to/game/shared-fonts"
            echo '```'
            echo ""
            echo "字体 NCA 的密钥世代随固件版本上升（例如 23.0.1 需要 \`key_area_key_application_16\`），"
            echo "固件太新而 keys 太旧会报 \`Missing key_area_key_application_XX in prod.keys\`，换更新的 keys 即可。"
            echo ""
            echo "## 运行要求"
            echo ""
            echo "x86-64 CPU（有 AVX2 走默认构建，只有 SSE4.2 会自动退化为 v2 构建）、"
            echo "Vulkan 1.3 显卡驱动、16 GB 内存、约 40 GB 空闲磁盘。"
            echo ""
            echo "## 说明"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 应用 ID | \`${APP_ID}\` |"
            echo "| 上游版本 | TotK Recomp **${TOTK_VERSION}** |"
            echo "| 运行时 | org.freedesktop.Platform 25.08 |"
            echo "| 构建来源 | 上游官方 \`TotK-Setup-x86_64-${TOTK_VERSION}-linux.AppImage\` |"
            echo ""
            echo "## 沙箱内的路径"
            echo ""
            echo '```'
            echo "/app/share/totk-recomp   # 上游 release 树（python/、llvm/、recomp/、tools/、runtime/、bin/）"
            echo "~/.var/app/${APP_ID}/data/.local/state/totk-recomp/setup.json   # 上次使用的游戏文件路径"
            echo '```'
            echo ""
            echo "游戏安装目录由你在安装器里选（默认在家目录中），通过 \`TOTK_GAME_DIR\` 告诉游戏入口它在哪里。"
            echo ""
            echo "## 文件校验 (SHA256)"
            echo '```'
            echo "${SHA256_FULL}"
            echo '```'
            echo ""
            echo "## 上游项目"
            echo ""
            echo "- 源码: https://github.com/${UPSTREAM_REPO}"
          } > release.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-flatpak
          path: ${{ env.APP_ID }}.flatpak
          retention-days: 14

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ github.workspace }}/release.txt
          files: ${{ github.workspace }}/${{ env.APP_ID }}.flatpak
          overwrite_files: true
