<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  TotK Recomp Flatpak: make the Chinese window text use Simplified-Chinese glyphs.

  The installer window is Tk 9 (installer/gui.py), and Tk on Linux draws through Xft/fontconfig.
  gui.py picks `DejaVu Sans` (and `DejaVu Sans Mono` for the log) on every non-Windows system:
  the release is built against the Steam Runtime, where DejaVu is always present. DejaVu has no
  CJK glyphs at all, so whoever draws a Chinese character has to come from fontconfig's fallback
  chain, which is only reached when fontconfig is asked for a character the requested family lacks.

  Without this file that fallback depends on the locale. In the sandbox LANG/LC_ALL are C.UTF-8
  (the runtime carries no zh_CN locale data), and with no language preference fontconfig resolves
  the CJK fallback to the first `lang=zh-cn` match in the collection, which is Noto Sans CJK **JP**:
  the characters appear, but with Japanese shapes (直/骨/次... differ from the Simplified forms).
  Preferring SC here makes that deterministic and language-independent.

  These are `prefer` aliases with binding="same", not replacements: Latin text keeps using DejaVu
  (whose metrics the layout is sized for) and only the families listed keep SC first in their
  fallback list, so a Chinese character inside an otherwise-English sentence still renders.
-->
<fontconfig>
  <!-- The two families installer/gui.py asks for on Linux. -->
  <alias binding="same"><family>DejaVu Sans</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>DejaVu Sans Mono</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <!-- ttk widgets that set no font of their own use TkDefaultFont, which Xft resolves via sans-serif. -->
  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
</fontconfig>
